<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holen">
<title>Holen</title>
<link rel="icon" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>   <rect width='512' height='512' rx='112' fill='%2312161c'/>   <circle cx='256' cy='256' r='168' fill='none' stroke='%235adca0' stroke-width='22'/>   <rect x='236' y='150' width='40' height='150' rx='8' fill='%235adca0'/>   <path d='M160 286 L256 392 L352 286 Z' fill='%235adca0'/> </svg> ">
<link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>   <rect width='512' height='512' rx='112' fill='%2312161c'/>   <circle cx='256' cy='256' r='168' fill='none' stroke='%235adca0' stroke-width='22'/>   <rect x='236' y='150' width='40' height='150' rx='8' fill='%235adca0'/>   <path d='M160 286 L256 392 L352 286 Z' fill='%235adca0'/> </svg> ">
<style>:root {
  --bg: #12161c;
  --card: #1a212b;
  --line: #2a3442;
  --text: #eef3f0;
  --muted: #9aa8a0;
  --accent: #5adca0;
  --accent-dim: #1e3d30;
  --danger: #ff7b7b;
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; }
body { padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
.brand { display: flex; gap: 12px; align-items: center; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-dim); border: 2px solid var(--accent); position: relative; }
.logo:after { content: ""; position: absolute; left: 50%; top: 22%; width: 4px; height: 14px; background: var(--accent); transform: translateX(-50%); }
.logo:before { content: ""; position: absolute; left: 50%; bottom: 8px; width: 14px; height: 10px; border-left: 4px solid var(--accent); border-right: 4px solid var(--accent); border-bottom: 4px solid var(--accent); transform: translateX(-50%) rotate(45deg); border-top: 0; }
h1 { margin: 0; font-size: 1.25rem; }
.brand p, .hint, .legal { margin: 0; color: var(--muted); font-size: .85rem; }
form, .sheet-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
input, select, button { font: inherit; color: var(--text); }
input, select { width: 100%; background: #10151b; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: grid; gap: 6px; font-size: .8rem; color: var(--muted); }
button { background: var(--accent); color: #062016; border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; cursor: pointer; }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
button:disabled { opacity: .55; }
.status { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.status.err { border-color: var(--danger); color: var(--danger); }
.picker { display: grid; gap: 10px; margin-top: 14px; }
.pick { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-decoration: none; color: inherit; }
.pick img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #000; }
.history { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 8px; }
.history a { color: var(--accent); text-decoration: none; word-break: break-all; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: end center; padding: 12px; z-index: 40; }
.sheet-card { width: min(640px, 100%); margin-bottom: env(safe-area-inset-bottom); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button { padding: 8px 10px; font-size: .8rem; background: var(--accent-dim); color: var(--accent); }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.legal { margin-top: 4px; }
.sr { position: absolute; left: -9999px; }
#turnstileBox { margin-top: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div><h1>Holen</h1><p>Link rein. Datei raus. Build-Version.</p></div>
  </div>
  <button id="settingsBtn" class="ghost" type="button">Instanz</button>
</header>
<main>
<form id="form">
  <label class="sr" for="url">Link</label>
  <input id="url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://…" required>
  <div class="row">
    <label>Qualität
      <select id="quality">
        <option value="max">Maximum</option>
        <option value="2160">2160p</option>
        <option value="1440">1440p</option>
        <option value="1080" selected>1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </label>
    <label>Modus
      <select id="mode">
        <option value="auto" selected>Video + Audio</option>
        <option value="audio">Nur Audio</option>
        <option value="mute">Stumm (Video)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label>Audioformat
      <select id="audioFormat">
        <option value="mp3" selected>MP3</option>
        <option value="best">Best</option>
        <option value="ogg">OGG</option>
        <option value="opus">Opus</option>
        <option value="wav">WAV</option>
      </select>
    </label>
    <label>Bitrate
      <select id="audioBitrate">
        <option value="320">320</option>
        <option value="256">256</option>
        <option value="128" selected>128</option>
        <option value="96">96</option>
        <option value="64">64</option>
      </select>
    </label>
  </div>
  <button id="go" type="submit">Holen</button>
</form>
<p id="status" class="status" hidden></p>
<div id="turnstileBox" hidden>
  <p class="hint">Diese Instanz will kurz prüfen, dass du kein Bot bist.</p>
  <div id="turnstile"></div>
</div>
<div id="picker" class="picker" hidden></div>
<ul id="history" class="history"></ul>
</main>
<aside id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <h2>Cobalt-Instanz</h2>
    <p class="hint">Alles in einer Datei. Die Verarbeitung macht weiter eine Cobalt-API.</p>
    <label>API-URL<input id="apiUrl" type="url" placeholder="https://nuko-c.meowing.de"></label>
    <label>API-Key (optional)<input id="apiKey" type="password" autocomplete="off"></label>
    <div class="presets">
      <button type="button" data-api="https://nuko-c.meowing.de">meowing.de</button>
      <button type="button" data-api="https://api.cobalt.rpkiinval.id">rpkiinval.id</button>
      <button type="button" data-api="https://cobalt-omega.wolfy.love">canine omega</button>
      <button type="button" data-api="https://bergung-api.hoffnungfuerdiezukunft.net">bergung</button>
    </div>
    <p id="instanceInfo" class="hint"></p>
    <div class="sheet-actions">
      <button type="button" id="testApi" class="ghost">Testen</button>
      <button type="button" id="saveApi">Speichern</button>
    </div>
    <p class="legal">Nur öffentlich erreichbare Inhalte. Cobalt ist kein Piraterie-Tool.</p>
  </div>
</aside>
<script>const STORAGE = "holen-settings-v1";
const HISTORY = "holen-history-v1";
const DEFAULT_API = "https://nuko-c.meowing.de";

const $ = (id) => document.getElementById(id);
const form = $("form");
const statusEl = $("status");
const pickerEl = $("picker");
const sheet = $("sheet");

let settings = loadSettings();
let bearer = null;
let turnstileWidget = null;

function loadSettings() {
  try {
    return { apiUrl: DEFAULT_API, apiKey: "", ...JSON.parse(localStorage.getItem(STORAGE) || "{}") };
  } catch {
    return { apiUrl: DEFAULT_API, apiKey: "" };
  }
}

function saveSettings() {
  localStorage.setItem(STORAGE, JSON.stringify({
    apiUrl: settings.apiUrl.replace(/\/$/, ""),
    apiKey: settings.apiKey.trim(),
  }));
}

function setStatus(text, err = false) {
  statusEl.hidden = !text;
  statusEl.textContent = text;
  statusEl.classList.toggle("err", !!err);
}

function apiBase() {
  return (settings.apiUrl || DEFAULT_API).replace(/\/$/, "");
}

function authHeaders() {
  const headers = { Accept: "application/json", "Content-Type": "application/json" };
  if (settings.apiKey) headers.Authorization = `Api-Key ${settings.apiKey}`;
  else if (bearer) headers.Authorization = `Bearer ${bearer}`;
  return headers;
}

async function getInfo() {
  const res = await fetch(apiBase() + "/", { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("Instanz antwortet nicht (" + res.status + ")");
  const data = await res.json().catch(() => null);
  if (!data || !data.cobalt) throw new Error("Keine gültige Cobalt-Antwort");
  return data;
}

function loadTurnstile(sitekey) {
  return new Promise((resolve, reject) => {
    const go = () => {
      $("turnstileBox").hidden = false;
      if (turnstileWidget != null && window.turnstile) {
        try { window.turnstile.remove(turnstileWidget); } catch {}
      }
      turnstileWidget = window.turnstile.render("turnstile", {
        sitekey,
        theme: "dark",
        callback: resolve,
        "error-callback": () => reject(new Error("Turnstile fehlgeschlagen")),
        "expired-callback": () => reject(new Error("Turnstile abgelaufen – nochmal versuchen")),
      });
    };
    if (window.turnstile) return go();
    const s = document.createElement("script");
    s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    s.async = true;
    s.onload = go;
    s.onerror = () => reject(new Error("Turnstile-Script blockiert (Adblocker?)"));
    document.head.appendChild(s);
  });
}

async function ensureSession(info) {
  bearer = null;
  const key = info && info.cobalt && info.cobalt.turnstileSitekey;
  if (!key || settings.apiKey) {
    $("turnstileBox").hidden = true;
    return;
  }
  setStatus("Kurz warten: Bot-Check der Instanz …");
  const token = await loadTurnstile(key);
  const res = await fetch(apiBase() + "/session", {
    method: "POST",
    headers: { Accept: "application/json", "cf-turnstile-response": token },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.token) {
    const code = (data.error && data.error.code) || "";
    throw new Error(humanError(code) || "Session fehlgeschlagen");
  }
  bearer = data.token;
  $("turnstileBox").hidden = true;
}

function triggerDownload(url, filename) {
  const a = document.createElement("a");
  a.href = url;
  if (filename) a.download = filename;
  a.rel = "noopener";
  a.target = "_blank";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function addHistory(source, filename) {
  try {
    const list = JSON.parse(localStorage.getItem(HISTORY) || "[]");
    list.unshift({ source, filename, t: Date.now() });
    localStorage.setItem(HISTORY, JSON.stringify(list.slice(0, 20)));
  } catch {}
  renderHistory();
}

function renderHistory() {
  try {
    const list = JSON.parse(localStorage.getItem(HISTORY) || "[]");
    $("history").innerHTML = list.map((item) => {
      const label = (item.filename || item.source || "").replace(/</g, "&lt;");
      const href = String(item.source || "#").replace(/"/g, "&quot;");
      return `<li><a href="${href}" target="_blank" rel="noopener">${label}</a></li>`;
    }).join("");
  } catch {
    $("history").innerHTML = "";
  }
}

function showPicker(data) {
  pickerEl.hidden = false;
  const items = data.picker || [];
  const audio = data.audio
    ? `<a class="pick" href="${data.audio}" download="${data.audioFilename || "audio"}" target="_blank" rel="noopener">Nur Audio speichern</a>`
    : "";
  pickerEl.innerHTML = audio + items.map((item, i) => {
    const thumb = item.thumb ? `<img src="${item.thumb}" alt="" loading="lazy">` : "";
    const label = (item.type || "Datei") + " " + (i + 1);
    return `<a class="pick" href="${item.url}" download target="_blank" rel="noopener">${thumb}<span>${label}</span></a>`;
  }).join("");
}

function humanError(code) {
  const map = {
    "error.api.auth.api-key.missing": "Diese Instanz will einen API-Key.",
    "error.api.auth.api-key.invalid": "API-Key ungültig.",
    "error.api.auth.turnstile.missing": "Bot-Check fehlt – Instanz wechseln oder nochmal versuchen.",
    "error.api.auth.turnstile.invalid": "Bot-Check ungültig – nochmal versuchen.",
    "error.api.auth.jwt.missing": "Session abgelaufen – nochmal holen.",
    "error.api.auth.jwt.invalid": "Session ungültig – nochmal holen.",
    "error.api.fetch.empty": "Quelle leer oder blockiert.",
    "error.api.fetch.fail": "Quelle nicht erreichbar.",
    "error.api.fetch.critical": "Quelle blockiert die Abfrage.",
    "error.api.link.invalid": "Kein gültiger Link.",
    "error.api.link.unsupported": "Diese Seite unterstützt die Instanz nicht.",
    "error.api.youtube.disabled_main_instance": "YouTube auf dieser Instanz aus. Andere Instanz nehmen.",
    "error.api.youtube.login": "YouTube verlangt Login auf dieser Instanz.",
    "error.api.rate_exceeded": "Zu viele Anfragen. Kurz warten oder Instanz wechseln.",
    "error.api.service.unsupported": "Dienst wird von der Instanz nicht unterstützt.",
    "error.api.content.too_long": "Inhalt zu lang für die Instanz.",
  };
  return map[code] || code || null;
}

async function processUrl(url) {
  pickerEl.hidden = true;
  setStatus("Instanz prüfen …");
  const info = await getInfo();
  await ensureSession(info);
  setStatus("Datei vorbereiten …");
  const body = {
    url,
    videoQuality: $("quality").value,
    downloadMode: $("mode").value,
    audioFormat: $("audioFormat").value,
    audioBitrate: $("audioBitrate").value,
    filenameStyle: "pretty",
    localProcessing: "disabled",
    alwaysProxy: true,
    youtubeVideoCodec: "h264",
  };
  const res = await fetch(apiBase() + "/", {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (data.status === "error") {
    const code = data.error && data.error.code;
    throw new Error(humanError(code) || code || "Unbekannter Fehler");
  }
  if (data.status === "picker") {
    setStatus("Mehrere Dateien – such dir eine aus.");
    showPicker(data);
    addHistory(url, "Auswahl");
    return;
  }
  if (data.status === "tunnel" || data.status === "redirect") {
    setStatus("Download startet: " + (data.filename || "Datei"));
    triggerDownload(data.url, data.filename);
    addHistory(url, data.filename);
    return;
  }
  if (data.status === "local-processing") {
    throw new Error("Diese Instanz will lokal verarbeiten. Andere Instanz wählen.");
  }
  throw new Error("Unerwartete Antwort: " + (data.status || res.status));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("url").value.trim();
  if (!url) return;
  $("go").disabled = true;
  try {
    await processUrl(url);
  } catch (err) {
    const msg = String(err.message || err);
    const cors = /Failed to fetch|NetworkError|CORS|Load failed|Network request failed/i.test(msg);
    setStatus(
      cors
        ? "CORS/Netzwerk: Diese Instanz lässt fremde Frontends nicht zu. Andere Instanz wählen oder selbst hosten."
        : msg,
      true
    );
  } finally {
    $("go").disabled = false;
  }
});

$("settingsBtn").onclick = () => {
  $("apiUrl").value = settings.apiUrl;
  $("apiKey").value = settings.apiKey;
  $("instanceInfo").textContent = "";
  sheet.hidden = false;
};
sheet.addEventListener("click", (e) => {
  if (e.target === sheet) sheet.hidden = true;
});
document.querySelectorAll("[data-api]").forEach((btn) => {
  btn.onclick = () => {
    $("apiUrl").value = btn.dataset.api;
  };
});
$("saveApi").onclick = () => {
  settings.apiUrl = $("apiUrl").value.trim() || DEFAULT_API;
  settings.apiKey = $("apiKey").value.trim();
  saveSettings();
  bearer = null;
  sheet.hidden = true;
  setStatus("Instanz gespeichert: " + apiBase());
};
$("testApi").onclick = async () => {
  const prev = settings.apiUrl;
  settings.apiUrl = $("apiUrl").value.trim() || DEFAULT_API;
  $("instanceInfo").textContent = "Prüfe …";
  try {
    const info = await getInfo();
    const services = ((info.cobalt && info.cobalt.services) || []).slice(0, 10).join(", ");
    const ts = info.cobalt && info.cobalt.turnstileSitekey ? " · Turnstile an" : "";
    const ver = (info.cobalt && info.cobalt.version) || "?";
    $("instanceInfo").textContent = "OK · v" + ver + (services ? " · " + services : "") + ts;
  } catch (err) {
    $("instanceInfo").textContent = "Fehler: " + (err.message || err);
  } finally {
    settings.apiUrl = prev;
  }
};

renderHistory();
$("url").addEventListener("focus", async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text && /^https?:\/\//i.test(text.trim()) && !$("url").value) {
      $("url").value = text.trim();
    }
  } catch {}
});
</script>
<script>
(function(){
  const manifest = {
    name: "Holen",
    short_name: "Holen",
    start_url: ".",
    display: "standalone",
    background_color: "#12161c",
    theme_color: "#12161c",
    icons: [
      { src: "data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>   <rect width='512' height='512' rx='112' fill='%2312161c'/>   <circle cx='256' cy='256' r='168' fill='none' stroke='%235adca0' stroke-width='22'/>   <rect x='236' y='150' width='40' height='150' rx='8' fill='%235adca0'/>   <path d='M160 286 L256 392 L352 286 Z' fill='%235adca0'/> </svg> ", sizes: "any", type: "image/svg+xml", purpose: "any" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();
</script>
</body>
</html>
